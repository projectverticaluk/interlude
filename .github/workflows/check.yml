name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Check the published script in memory
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Invoke-RestMethod "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/run.ps1"
          & ([scriptblock]::Create($source)) -SelfTest
